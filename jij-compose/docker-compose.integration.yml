# Used by the Python integration tests instead of docker-compose.override.yml:
# isolated container names/ports so it can run alongside the local dev stack.
# docker compose -p jij-integration -f docker-compose.yml -f docker-compose.integration.yml up -d --build

x-service-env-variables: &service-env-variables
      JIJ_SERVICE_CONFIG_URI: configuration/service-configuration.integration.json

services:

  jij-service:
    environment:
      <<: *service-env-variables
    ports:
      - "5021:8080"
    depends_on:
      - mongodb
      - redis

  mongodb:
     container_name: mongodb-integration
     hostname: mongodb
     image: mongo
     ports:
       - "27018:27017"

  redis:
     container_name: redis-integration
     hostname: redis
     image: redis
     ports:
       - "6380:6379"